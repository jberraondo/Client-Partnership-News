name: Collect morning news

# When this runs:
#   - 08:50 and 09:45 UK time, every day, all year round.
#   - Or any time you press the "Run workflow" button on the Actions tab.
#
# GitHub's schedule only understands UTC, which ignores British Summer Time. So
# each run is booked at BOTH possible UTC times, and the "uk-time" job below lets
# through only the one that matches UK time today; the other stops straight away.
#   08:50 UK = 07:50 UTC in summer (BST), 08:50 UTC in winter (GMT)
#   09:45 UK = 08:45 UTC in summer (BST), 09:45 UTC in winter (GMT)
# Note: GitHub sometimes starts scheduled runs 5-30 minutes late when it's busy.
on:
  schedule:
    - cron: "50 7 * * *"   # 08:50 UK in summer
    - cron: "50 8 * * *"   # 08:50 UK in winter
    - cron: "45 8 * * *"   # 09:45 UK in summer
    - cron: "45 9 * * *"   # 09:45 UK in winter
  workflow_dispatch:

# Let the job save the freshly-scraped news back into the repo.
permissions:
  contents: write

# Never run two collections at once (they'd both try to save news.json).
concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  uk-time:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Check this is the right run for UK time today
        id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Is the UK on summer time (+0100) or winter time (+0000) today?
          if [ "$(TZ=Europe/London date +%z)" = "+0100" ]; then
            WANTED="50 7 * * *|45 8 * * *"
          else
            WANTED="50 8 * * *|45 9 * * *"
          fi
          if echo "$WANTED" | tr '|' '\n' | grep -qxF "$CRON"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not this one: today the UK-time run uses the other booking."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: uk-time
    if: needs.uk-time.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tools
        run: pip install -r requirements.txt

      - name: Install the headless browser
        run: python -m playwright install --with-deps chromium

      - name: Install Claude (writes the summary bullets)
        run: npm install -g @anthropic-ai/claude-code

      - name: Scrape the news
        # Claude checks broad-search headlines here, before the slow link and article work.
        env:
          WINDOW_HOURS: "48"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python scrape.py

      - name: Write the summary bullets
        # Signs in with your Claude subscription. Add the token under
        # Settings → Secrets and variables → Actions → CLAUDE_CODE_OAUTH_TOKEN.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAX_STORIES: "120"   # only two runs a day, so the first one has a full day to catch up on
        run: python summarise.py

      - name: Save the results
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/pending.json
          git commit -m "Morning news $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes today"
          git pull --rebase origin main
          git push
