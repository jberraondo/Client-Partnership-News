name: Collect morning news

# When this runs:
#   - Automatically every 2 hours from 06:00 to 18:00 UTC, so there are always fresh
#     stories during the UK working day and the page's Refresh button feels live.
#     (07:30 included so it's ready before you get in at 9am.)
#   - Or any time you press the "Run workflow" button on the Actions tab.
on:
  schedule:
    - cron: "30 7 * * *"
    - cron: "0 6,8,10,12,14,16,18 * * *"
  workflow_dispatch:

# Let the job save the freshly-scraped news back into the repo.
permissions:
  contents: write

# Never run two collections at once (they'd both try to save news.json).
concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tools
        run: pip install -r requirements.txt

      - name: Install the headless browser
        run: python -m playwright install --with-deps chromium

      - name: Install Claude (writes the summary bullets)
        run: npm install -g @anthropic-ai/claude-code

      - name: Scrape the news
        env:
          WINDOW_HOURS: "48"
        run: python scrape.py

      - name: Write the summary bullets
        # Signs in with your Claude subscription. Add the token under
        # Settings → Secrets and variables → Actions → CLAUDE_CODE_OAUTH_TOKEN.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python summarise.py

      - name: Save the results
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/pending.json
          git commit -m "Morning news $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes today"
          git pull --rebase origin main
          git push
